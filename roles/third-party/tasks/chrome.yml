---
- name: Probe Google Chrome RPM
  ansible.builtin.uri:
    url: https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm
    method: HEAD
    status_code: [200, 301, 302]
  register: chrome_probe
  failed_when: false
  changed_when: false
  tags: [third_party, chrome]

- name: Note unreachable Google Chrome RPM
  ansible.builtin.debug:
    msg: "Google Chrome RPM unreachable — skipping."
  when: chrome_probe.status | default(0) != 200
  tags: [third_party, chrome]

- name: Import Google Linux signing keys
  ansible.builtin.rpm_key:
    state: present
    key: "{{ item }}"
  loop:
    - https://dl-ssl.google.com/linux/linux_signing_key.pub
    - https://packages.cloud.google.com/yum/doc/yum-key.gpg
    - https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg
  become: true
  when: chrome_probe.status | default(0) == 200
  tags: [third_party, chrome]

- name: Check if Google Chrome repo exists
  ansible.builtin.stat:
    path: /etc/yum.repos.d/google-chrome.repo
  register: google_chrome_repo
  when: chrome_probe.status | default(0) == 200
  tags: [third_party, chrome]

- name: Install Google Chrome repo (bootstrap RPM)
  ansible.builtin.dnf:
    name: https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm
    state: present
  when:
    - chrome_probe.status | default(0) == 200
    - not (google_chrome_repo.stat.exists | default(false))
  become: true
  tags: [third_party, chrome]

- name: Ensure Google Chrome repo enabled
  community.general.ini_file:
    path: /etc/yum.repos.d/google-chrome.repo
    section: google-chrome
    option: enabled
    value: 1
    create: false
  become: true
  when: chrome_probe.status | default(0) == 200
  tags: [third_party, chrome]

- name: Install Google Chrome
  ansible.builtin.package:
    name: google-chrome-stable
    state: present
  become: true
  when: chrome_probe.status | default(0) == 200
  tags: [third_party, chrome]

- name: Ensure user applications directory exists
  ansible.builtin.file:
    path: /home/{{ local_user }}/.local/share/applications
    state: directory
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0755"
  become: true
  when: chrome_probe.status | default(0) == 200
  tags: [third_party, chrome]

- name: Deploy user google-chrome.desktop
  ansible.builtin.copy:
    src: templates/gnome_desktop/google-chrome.desktop
    dest: /home/{{ local_user }}/.local/share/applications/google-chrome.desktop
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0644"
  when: chrome_probe.status | default(0) == 200
  tags: [third_party, chrome]

# The RPM ships TWO launchers — google-chrome.desktop and com.google.Chrome.desktop
# — and both declare StartupWMClass=google-chrome. The override above only shadows
# the first, so the class stays double-claimed and GNOME Shell is free to bind a
# Chrome window to the com.google.Chrome entry instead of the pinned one, which
# surfaces as a duplicate dock icon. Shadow the reverse-DNS twin with a Hidden
# entry (Hidden=true means "deleted" per the desktop-entry spec, so GAppInfo drops
# it from the StartupWMClass index entirely) leaving exactly one claimant.
# Same failure mode the Alacritty override guards against in alacritty.yml.
- name: Hide the duplicate com.google.Chrome launcher from GNOME Shell
  ansible.builtin.copy:
    dest: /home/{{ local_user }}/.local/share/applications/com.google.Chrome.desktop
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      NoDisplay=true
      Hidden=true
  when: chrome_probe.status | default(0) == 200
  tags: [third_party, chrome]

# A favorite pinned to the reverse-DNS ID would now point at a hidden entry.
- name: Read GNOME dock favorites for Chrome fixup
  community.general.dconf:
    key: /org/gnome/shell/favorite-apps
    state: read
  register: chrome_favorites
  become: true
  become_user: "{{ local_user }}"
  when:
    - chrome_probe.status | default(0) == 200
    - not is_container | default(false)
  tags: [third_party, chrome]

- name: Repoint GNOME dock favorites at google-chrome.desktop
  community.general.dconf:
    key: /org/gnome/shell/favorite-apps
    value: "{{ chrome_favorites.value | regex_replace(\"'com\\.google\\.Chrome\\.desktop'\", \"'google-chrome.desktop'\") }}"
    state: present
  become: true
  become_user: "{{ local_user }}"
  when:
    - chrome_probe.status | default(0) == 200
    - not is_container | default(false)
    - chrome_favorites.value | default('', true) is search('com\.google\.Chrome\.desktop')
  tags: [third_party, chrome]

# Chrome enterprise policy: aggressive Memory Saver auto-discards
# inactive tabs to keep memory usage in check. Read on next Chrome launch.
- name: Ensure Chrome managed policies directory exists
  ansible.builtin.file:
    path: /etc/opt/chrome/policies/managed
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  when: chrome_probe.status | default(0) == 200
  tags: [third_party, chrome]

- name: Deploy Chrome Memory Saver policy
  ansible.builtin.copy:
    dest: /etc/opt/chrome/policies/managed/memory-saver.json
    owner: root
    group: root
    mode: '0644'
    content: |
      {
        "HighEfficiencyModeEnabled": true,
        "MemorySaverModeEnabled": true,
        "MemorySaverModeSavingsType": 2
      }
  become: true
  when: chrome_probe.status | default(0) == 200
  tags: [third_party, chrome]
