---
# rpm -q is a targeted presence check. The modules this rule suggests
# (yum / rpm_key) cannot answer "is this package installed?", and
# package_facts would read the entire RPM database to learn one bit.
- name: Check if Slack is already installed  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: rpm -q slack
  register: slack_installed
  changed_when: false
  failed_when: false
  tags: [third_party, slack]

- name: Probe Slack RPM download
  ansible.builtin.uri:
    url: "https://downloads.slack-edge.com/desktop-releases/linux/x64/4.46.101/slack-4.46.101-0.1.el8.x86_64.rpm"
    method: HEAD
    status_code: [200, 301, 302]
  register: slack_probe
  failed_when: false
  changed_when: false
  when: slack_installed.rc != 0
  tags: [third_party, slack]

- name: Note unreachable Slack RPM
  ansible.builtin.debug:
    msg: "Slack RPM unreachable — skipping."
  when:
    - slack_installed.rc != 0
    - slack_probe.status | default(0) != 200
  tags: [third_party, slack]

# The browser User-Agent is required — slack-edge.com serves a redirect/error to
# default agents rather than the RPM. get_url carries it via headers, so this no
# longer needs to shell out to curl.
- name: Download Slack RPM
  ansible.builtin.get_url:
    url: "https://downloads.slack-edge.com/desktop-releases/linux/x64/4.46.101/slack-4.46.101-0.1.el8.x86_64.rpm"
    dest: /tmp/slack-latest.rpm
    mode: "0644"
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  when:
    - slack_installed.rc != 0
    - slack_probe.status | default(0) == 200
  tags: [third_party, slack]

- name: Verify downloaded file is an RPM
  ansible.builtin.command:
    cmd: file -b /tmp/slack-latest.rpm
  register: slack_rpm_file
  changed_when: false
  failed_when: "'RPM' not in slack_rpm_file.stdout"
  vars:
    ansible_shell_executable: /bin/bash
  when:
    - slack_installed.rc != 0
    - slack_probe.status | default(0) == 200
  tags: [third_party, slack]

- name: Show downloaded file type when verification failed
  ansible.builtin.debug:
    msg: "Downloaded file /tmp/slack-latest.rpm type: {{ slack_rpm_file.stdout }}"
  when:
    - slack_installed.rc != 0
    - slack_probe.status | default(0) == 200
    - "'RPM' not in slack_rpm_file.stdout"
  tags: [third_party, slack]

- name: Install Slack (latest RPM)
  ansible.builtin.dnf:
    name: /tmp/slack-latest.rpm
    disable_gpg_check: true
    state: present
  become: true
  when:
    - slack_installed.rc != 0
    - slack_probe.status | default(0) == 200
  tags: [third_party, slack]

- name: Re-check Slack after install
  ansible.builtin.stat:
    path: /usr/bin/slack
  register: slack_present
  tags: [third_party, slack]

- name: Ensure user applications directory exists
  ansible.builtin.file:
    path: /home/{{ local_user }}/.local/share/applications
    state: directory
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0755"
  become: true
  when: slack_present.stat.exists
  tags: [third_party, slack]

# Shadows /usr/share/applications/slack.desktop (exact desktop-ID match, so it
# overrides rather than adding a second entry) purely to swap the hardcoded
# absolute Icon= path for a themeable icon name. StartupWMClass is preserved so
# window-to-launcher matching keeps working and the dock shows one tile.
- name: Deploy user slack.desktop with a themeable icon
  ansible.builtin.copy:
    src: templates/gnome_desktop/slack.desktop
    dest: /home/{{ local_user }}/.local/share/applications/slack.desktop
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0644"
  when: slack_present.stat.exists
  tags: [third_party, slack]
