---
# GNOME's color-scheme + gtk-theme dconf keys only reach GTK3/4 libadwaita
# apps that actually consult them. Legacy toolkits miss out:
#   - GTK2 apps read ~/.gtkrc-2.0 and ignore dconf entirely (and Adwaita-dark
#     for GTK2 only exists if adwaita-gtk2-theme is installed — on Fedora
#     it's split out from gnome-themes-extra)
#   - Qt apps default to Fusion-light unless QT_QPA_PLATFORMTHEME points at
#     a Qt integration plugin (qgnomeplatform reads the same gsettings the
#     GNOME apps do, so dark mode propagates)
#   - GTK3 apps launched outside a logged-in GNOME session (e.g. from a
#     terminal over SSH or via systemd-run) don't see the dconf values and
#     need ~/.config/gtk-3.0/settings.ini as a fallback
# Unlike Ubuntu noble, Fedora packages qgnomeplatform-qt6, so both Qt5 and
# Qt6 apps can route through the gsettings-aware platform theme — no
# QT_STYLE_OVERRIDE workaround needed.
# Availability of these theming packages varies by Fedora release. The GTK2
# Adwaita theme (gnome-themes-extra / adwaita-gtk2-theme) and the Adwaita Qt
# style (adwaita-qt5 / adwaita-qt6) were orphaned and dropped after Fedora 43
# (see Changes/NoCustomQtThemingForWorkstation); qgnomeplatform-qt{5,6} — the
# gsettings-aware Qt platform theme that actually propagates GNOME dark mode —
# is still shipped. So probe what the running release provides and install only
# that, instead of hard-failing the whole play on a package that no longer
# exists. The ~/.gtkrc-2.0 / settings.ini steps below stay harmless either way:
# if the GTK2 theme isn't installed, GTK2 apps simply fall back.
- name: Probe which legacy-toolkit dark-mode packages this release ships
  ansible.builtin.command: "dnf -q repoquery --qf '%{name}' {{ item }}"  # noqa: command-instead-of-module
  loop:
    - gnome-themes-extra
    - adwaita-gtk2-theme
    - qgnomeplatform-qt5
    - qgnomeplatform-qt6
    - adwaita-qt5
    - adwaita-qt6
  become: true
  register: gnome_darkmode_pkg_probe
  changed_when: false
  failed_when: false
  tags: [gnome, dark-mode]

- name: Partition dark-mode packages into available vs missing
  ansible.builtin.set_fact:
    gnome_darkmode_pkgs_available: "{{ gnome_darkmode_pkg_probe.results | selectattr('stdout', 'truthy') | map(attribute='item') | list }}"
    gnome_darkmode_pkgs_missing: "{{ gnome_darkmode_pkg_probe.results | rejectattr('stdout', 'truthy') | map(attribute='item') | list }}"
  tags: [gnome, dark-mode]

- name: Note legacy-toolkit dark-mode packages not shipped by this release
  ansible.builtin.debug:
    msg: "Skipping theming packages not in this Fedora release's repos: {{ gnome_darkmode_pkgs_missing | join(', ') }}"
  when: gnome_darkmode_pkgs_missing | length > 0
  tags: [gnome, dark-mode]

- name: Install available legacy-toolkit dark-mode integration packages
  ansible.builtin.dnf:
    name: "{{ gnome_darkmode_pkgs_available }}"
    state: present
  become: true
  when: gnome_darkmode_pkgs_available | length > 0
  tags: [gnome, dark-mode]

- name: Ensure GTK config directories exist
  ansible.builtin.file:
    path: "/home/{{ local_user }}/{{ item }}"
    state: directory
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0755"
  become: true
  loop:
    - .config/gtk-3.0
    - .config/gtk-4.0
  tags: [gnome, dark-mode]

- name: Configure GTK2 dark theme (~/.gtkrc-2.0)
  ansible.builtin.copy:
    dest: "/home/{{ local_user }}/.gtkrc-2.0"
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      gtk-theme-name = "Adwaita-dark"
      gtk-icon-theme-name = "Adwaita"
      gtk-cursor-theme-name = "Adwaita"
  become: true
  tags: [gnome, dark-mode]

- name: Configure GTK3 dark theme (~/.config/gtk-3.0/settings.ini)
  ansible.builtin.copy:
    dest: "/home/{{ local_user }}/.config/gtk-3.0/settings.ini"
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      [Settings]
      gtk-application-prefer-dark-theme = 1
      gtk-theme-name = Adwaita-dark
      gtk-icon-theme-name = Adwaita
      gtk-cursor-theme-name = Adwaita
  become: true
  tags: [gnome, dark-mode]

- name: Configure GTK4 dark theme preference (~/.config/gtk-4.0/settings.ini)
  ansible.builtin.copy:
    dest: "/home/{{ local_user }}/.config/gtk-4.0/settings.ini"
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      [Settings]
      gtk-application-prefer-dark-theme = 1
  become: true
  tags: [gnome, dark-mode]

# /etc/environment is read by PAM at login, so this needs a session restart
# to take effect. Routes Qt5/Qt6 apps through qgnomeplatform, which reads
# org.gnome.desktop.interface.color-scheme — so flipping GNOME between light
# and dark also flips Qt apps without a separate config.
- name: Route Qt apps through the GNOME platform theme
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: "^QT_QPA_PLATFORMTHEME="
    line: "QT_QPA_PLATFORMTHEME=gnome"
    state: present
    create: false
  become: true
  tags: [gnome, dark-mode]
