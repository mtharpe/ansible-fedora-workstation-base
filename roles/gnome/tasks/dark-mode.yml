---
# GNOME's color-scheme + gtk-theme dconf keys only reach GTK3/4 libadwaita apps
# that actually consult them. Everything else needs help:
#
#   - Qt apps default to a light Fusion palette unless QT_QPA_PLATFORMTHEME
#     points at a platform-theme plugin that knows about GNOME's dark mode.
#   - Qt Wayland apps draw their OWN titlebar (client-side). The stock
#     "bradient" decoration is always light; the Adwaita decoration reads the
#     org.freedesktop.appearance portal and follows the session.
#   - Electron apps default to XWayland, where Electron draws a light CSD
#     titlebar of its own; run natively on Wayland they follow the portal.
#   - GTK2 apps read ~/.gtkrc-2.0 and ignore dconf entirely.
#   - GTK3 apps launched outside a logged-in GNOME session (from a terminal
#     over SSH, via systemd-run) don't see the dconf values and need
#     ~/.config/gtk-3.0/settings.ini as a fallback.
#
# On QT_QPA_PLATFORMTHEME: this used to be "gnome", which selected
# qgnomeplatform — the gsettings-aware plugin that read color-scheme directly.
# Fedora dropped qgnomeplatform-qt{5,6} (along with adwaita-qt{5,6},
# gnome-themes-extra and adwaita-gtk2-theme) after F43, see
# Changes/NoCustomQtThemingForWorkstation. With the plugin gone, "gnome" falls
# back to Qt's *built-in* QGnomeTheme, which supplies fonts and dialog button
# layout but NO dark palette — and, worse, claiming the slot stops Qt from
# reaching for a plugin that would have worked. That silent downgrade is why Qt
# apps went light. "gtk3" selects libqgtk3.so, which is still shipped for both
# Qt5 and Qt6 and lifts its palette straight out of the active GTK3 theme by
# parsing the theme's on-disk CSS directly — it does NOT consult
# gtk-application-prefer-dark-theme. So the palette is only dark if the pinned
# gtk-theme resolves to a theme whose CSS is dark; the compiled-in Adwaita is
# light-only from libqgtk3's viewpoint. The pin below uses adw-gtk3-dark for
# exactly that reason (see the block above the dconf task).
#
# The probe below stays because release-to-release availability is exactly what
# bit us: install what this Fedora actually ships and note the rest, rather than
# hard-failing the play on a package that no longer exists.
- name: Probe which legacy-toolkit dark-mode packages this release ships
  ansible.builtin.command: "dnf -q repoquery --qf '%{name}' {{ item }}"  # noqa: command-instead-of-module
  loop: "{{ gnome_darkmode_candidate_pkgs }}"
  become: true
  register: gnome_darkmode_pkg_probe
  changed_when: false
  failed_when: false
  tags: [gnome, dark-mode]

- name: Partition dark-mode packages into available vs missing
  ansible.builtin.set_fact:
    gnome_darkmode_pkgs_available: "{{ gnome_darkmode_pkg_probe.results | selectattr('stdout', 'truthy') | map(attribute='item') | list }}"
    gnome_darkmode_pkgs_missing: "{{ gnome_darkmode_pkg_probe.results | rejectattr('stdout', 'truthy') | map(attribute='item') | list }}"
  tags: [gnome, dark-mode]

- name: Note legacy-toolkit dark-mode packages not shipped by this release
  ansible.builtin.debug:
    msg: "Skipping theming packages not in this Fedora release's repos: {{ gnome_darkmode_pkgs_missing | join(', ') }}"
  when: gnome_darkmode_pkgs_missing | length > 0
  tags: [gnome, dark-mode]

- name: Install available legacy-toolkit dark-mode integration packages
  ansible.builtin.dnf:
    name: "{{ gnome_darkmode_pkgs_available }}"
    state: present
  become: true
  when: gnome_darkmode_pkgs_available | length > 0
  tags: [gnome, dark-mode]

# GNOME Tweaks' "Legacy Applications" row is a combo built from
# {Adwaita, HighContrast, HighContrastInverse} plus every on-disk theme with a
# gtk-3.0/gtk.css. When gtk-theme holds a value that isn't in that set, the combo
# has nothing to preselect, settles on an arbitrary member (Python set order, so
# it varies per launch — frequently High Contrast) and its "changed" handler
# writes that back to dconf *and* forces gtk-application-prefer-dark-theme=0 into
# ~/.config/gtk-3.0/settings.ini, which is what breaks dark mode for legacy apps.
#
# Naming the theme correctly is necessary but not sufficient: anything that
# touches that combo can still clobber the key. Pinning gtk-theme in the system
# database and locking it makes the key non-writable, so the Tweaks write is
# refused and the value cannot drift again.
# On the pinned value: the earlier choice of 'Adwaita' + gtk-application-prefer-
# dark-theme=1 gets GTK3 apps that consult that key onto the dark Adwaita
# variant, but leaves consumers that read the theme CSS directly on the light
# palette. libqgtk3 (QT_QPA_PLATFORMTHEME=gtk3), CEF's GTK integration, and the
# Adwaita CSD decoration all fall into the second bucket. adw-gtk3-dark is a
# distinct on-disk theme (from adw-gtk3-theme, tracked in
# gnome_darkmode_candidate_pkgs) whose CSS is dark unconditionally, so every
# consumer resolves it to dark without needing to know about the prefer-dark
# key. Its palette follows libadwaita's design, so GTK3 apps end up visually
# indistinguishable from the GTK4/libadwaita apps next to them.
- name: Pin the legacy (GTK3) application theme in the system dconf database
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/00-legacy-app-theme
    owner: root
    group: root
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      [org/gnome/desktop/interface]
      gtk-theme='adw-gtk3-dark'
  become: true
  notify: Update dconf database
  tags: [gnome, dark-mode]

- name: Ensure the dconf lock directory exists
  ansible.builtin.file:
    path: /etc/dconf/db/local.d/locks
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [gnome, dark-mode]

- name: Lock the legacy application theme against GNOME Tweaks and the a11y toggle
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/locks/00-legacy-app-theme
    owner: root
    group: root
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      /org/gnome/desktop/interface/gtk-theme
  become: true
  notify: Update dconf database
  tags: [gnome, dark-mode]

- name: Ensure GTK and environment.d config directories exist
  ansible.builtin.file:
    path: "/home/{{ local_user }}/{{ item }}"
    state: directory
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0755"
  become: true
  loop:
    - .config/gtk-3.0
    - .config/gtk-4.0
    - .config/environment.d
  tags: [gnome, dark-mode]

- name: Configure GTK2 dark theme (~/.gtkrc-2.0)
  ansible.builtin.copy:
    dest: "/home/{{ local_user }}/.gtkrc-2.0"
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      gtk-theme-name = "adw-gtk3-dark"
      gtk-icon-theme-name = "{{ gnome_icon_theme if install_colloid_icons | default(false) else 'Adwaita' }}"
      gtk-cursor-theme-name = "Adwaita"
      gtk-cursor-theme-size = {{ gnome_cursor_size }}
  become: true
  tags: [gnome, dark-mode]

# Fallback file for GTK3 apps that don't see the session's dconf values (e.g.
# started from an SSH terminal or a systemd-run one-shot). Keeps
# gtk-application-prefer-dark-theme=1 for GTK3 apps that key off it, alongside
# the theme-name pin so CSS-reading consumers still see dark.
- name: Configure GTK3 dark theme (~/.config/gtk-3.0/settings.ini)
  ansible.builtin.copy:
    dest: "/home/{{ local_user }}/.config/gtk-3.0/settings.ini"
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      [Settings]
      gtk-application-prefer-dark-theme = 1
      gtk-theme-name = adw-gtk3-dark
      gtk-icon-theme-name = {{ gnome_icon_theme if install_colloid_icons | default(false) else 'Adwaita' }}
      gtk-cursor-theme-name = Adwaita
      gtk-cursor-theme-size = {{ gnome_cursor_size }}
  become: true
  tags: [gnome, dark-mode]

# GTK4/libadwaita ignores gtk-application-prefer-dark-theme *and* gtk-theme-name;
# it selects dark from the portal's color-scheme instead. adw-gtk3-theme ships
# GTK3 assets only (no gtk-4.0/ subdir), so a non-libadwaita GTK4 app pointed at
# adw-gtk3-dark would fall back to Adwaita — and Adwaita is what we want here
# anyway, since GTK4 carries both variants compiled in and prefer-dark-theme
# still selects the dark one for legacy GTK4 apps that consult it.
- name: Configure GTK4 dark theme preference (~/.config/gtk-4.0/settings.ini)
  ansible.builtin.copy:
    dest: "/home/{{ local_user }}/.config/gtk-4.0/settings.ini"
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      [Settings]
      gtk-application-prefer-dark-theme = 1
      gtk-theme-name = Adwaita
      gtk-icon-theme-name = {{ gnome_icon_theme if install_colloid_icons | default(false) else 'Adwaita' }}
      gtk-cursor-theme-name = Adwaita
      gtk-cursor-theme-size = {{ gnome_cursor_size }}
  become: true
  tags: [gnome, dark-mode]

# Two delivery points on purpose, because neither covers the other:
#   - /etc/environment is read by PAM, so it reaches the graphical session and
#     anything else that goes through login — but not systemd --user units.
#   - ~/.config/environment.d is read by systemd --user, which is what actually
#     spawns app launches from the Shell on a modern GNOME session.
# Both take effect at next login.
- name: Route Qt and Electron apps at the dark-aware theme integrations (system)
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    state: present
    create: false
  become: true
  loop: "{{ gnome_darkmode_env | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  tags: [gnome, dark-mode]

- name: Route Qt and Electron apps at the dark-aware theme integrations (user session)
  ansible.builtin.copy:
    dest: "/home/{{ local_user }}/.config/environment.d/90-dark-mode.conf"
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      {% for key, value in gnome_darkmode_env | dictsort %}
      {{ key }}={{ value }}
      {% endfor %}
  become: true
  tags: [gnome, dark-mode]
