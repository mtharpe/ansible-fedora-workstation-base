---
# This file is the tracked sane defaults for the playbook.
#
# On a fresh checkout: `cp vars/vars.example.yml vars/vars.yml` and edit
# vars/vars.yml for your personal toggles — it's gitignored.
#
# Edit THIS file (vars.example.yml) only when you want to change the defaults
# that ship in the repo, not for one-off local preferences.

# User
local_user: tharpem
local_user_email: mtharpe@noemail.not

# Services
enable_fail2ban: true
enable_sshd: false

# Subnet exempted from fail2ban (e.g. "192.168.1.0/24"). Empty = loopback only.
local_network: ""

# Extras
install_printers: true

# Third party
install_chrome: true
install_slack: true
install_spotify: false
install_vscode: true
install_zoom: true
# Twingate zero-trust client. Upstream publishes no GPG key for its RPM repo,
# so the repo is added with gpgcheck disabled (matching Twingate's own installer).
# After install, run `twingate setup` once to join a network.
install_twingate: true
twingate_repo_baseurl: "https://packages.twingate.com/rpm/"
install_lutris: false
install_steam: false
install_docker: false
install_gcloud: false
install_chef: false
install_autocpu: false
install_alacritty: true
install_bash: false
install_fish: true
install_starship: false
install_nerd_font: true
install_eza: true
install_claude: true
install_claude_desktop: true
install_kubectl: true

# Standalone Electron web apps (Gmail, Calendar, Tasks, Keep, Messages, Tidal,
# Messenger) built from https://github.com/mtharpe/electron-apps and installed
# under ~/.local. First run downloads the Electron runtime and packages every
# service in the upstream services.conf, so it is slow; later runs skip the
# build unless the checkout moved or an app is missing.
install_electron_apps: true
electron_apps_repo: https://github.com/mtharpe/electron-apps.git
electron_apps_version: main
electron_apps_src: "/home/{{ local_user }}/.local/src/electron-apps"
electron_apps_prefix: "/home/{{ local_user }}/.local"
# Filesystem slugs build-linux.sh derives from the names in its services.conf.
# Used only to detect whether a rebuild is needed.
electron_apps_slugs:
  - gmail
  - google-calendar
  - google-tasks
  - google-keep
  - google-messages
  - tidal
  - messenger

# Cursor size (px). Written to the GTK settings.ini fallbacks so apps that
# don't consult dconf (GTK apps launched outside a logged-in session, Flatpaks
# missing XCURSOR_SIZE, wxWidgets menus/decorations) draw the same size as the
# rest of the desktop instead of falling back to the ancient X core cursor.
gnome_cursor_size: 24

# Colloid icon theme (https://github.com/vinceliuice/Colloid-icon-theme).
# Installed per-user into ~/.local/share/icons and selected via gnome_icon_theme.
# Set install_colloid_icons: false to stay on Adwaita.
install_colloid_icons: true
gnome_icon_theme: Colloid-Dark
colloid_icon_repo: https://github.com/vinceliuice/Colloid-icon-theme.git
colloid_icon_version: main
colloid_icon_src: "/home/{{ local_user }}/.local/src/Colloid-icon-theme"
colloid_icon_dest: "/home/{{ local_user }}/.local/share/icons"
# Extra install.sh flags, e.g. "-t purple -s nord -b". Empty = default blue.
colloid_icon_install_args: ""
# Icons Colloid does not ship upstream; sourced from roles/gnome/files/colloid-icons/.
colloid_extra_icons:
  - google-keep.svg
  - google-tasks.svg

# Claude Code notification channel. "notifications_disabled" stops it raising
# desktop notifications; "terminal_bell" or "auto" re-enable them.
claude_notif_channel: notifications_disabled

# Desktop notifications from terminal apps are blocked via GNOME's per-app
# notification settings. Values are munged desktop IDs: Alacritty.desktop ->
# alacritty, org.gnome.Ptyxis.desktop -> org-gnome-ptyxis.
gnome_notification_blocked_apps:
  - alacritty
  - org-gnome-ptyxis
  - org-gnome-terminal
  - org-gnome-console
  - kgx

# Toolkit-integration packages probed for by roles/gnome/tasks/dark-mode.yml.
# Availability swings between Fedora releases — the qgnomeplatform / adwaita-qt
# / GTK2-Adwaita set was dropped after F43 — so the role installs whichever of
# these the running release still carries and reports the rest instead of
# failing. The qadwaitadecorations entries are what give Qt's client-side
# Wayland titlebars a dark, portal-following decoration. adw-gtk3-theme
# provides the on-disk "adw-gtk3-dark" theme this role pins gtk-theme to.
gnome_darkmode_candidate_pkgs:
  - adw-gtk3-theme
  - gnome-themes-extra
  - adwaita-gtk2-theme
  - qgnomeplatform-qt5
  - qgnomeplatform-qt6
  - adwaita-qt5
  - adwaita-qt6
  - qadwaitadecorations-qt5
  - qadwaitadecorations-qt6
  - qt6-qtwayland-adwaita-decoration

# Environment that makes non-GTK toolkits follow GNOME's dark mode. Written to
# both /etc/environment (PAM/login) and ~/.config/environment.d (systemd --user,
# which is what launches apps from the Shell). Takes effect at next login.
#   QT_QPA_PLATFORMTHEME       libqgtk3.so; builds the Qt palette from the
#                              active GTK3 theme. Replaces "gnome", which now
#                              resolves to Qt's built-in light-only fallback.
#   QT_WAYLAND_DECORATION      the Adwaita client-side decoration rather than
#                              the always-light "bradient" default.
#   ELECTRON_OZONE_PLATFORM_HINT  runs Electron apps natively on Wayland; under
#                              XWayland they draw their own light titlebar.
gnome_darkmode_env:
  QT_QPA_PLATFORMTHEME: gtk3
  QT_WAYLAND_DECORATION: adwaita
  ELECTRON_OZONE_PLATFORM_HINT: auto

# GNOME Shell extensions to install + enable. UUIDs must match
# extensions.gnome.org. Edit if any UUID needs to change.
gnome_extensions:
  - just-perfection-desktop@just-perfection
  - auto-move-windows@gnome-shell-extensions.gcampax.github.com
  - power-profile-switcher@fthx
  - auto-select-headset@krocg

# Local hand-written GNOME extensions to install (source trees under
# roles/gnome/files/local-extensions/<uuid>/). Leave empty if none.
gnome_local_extensions: []

# Custom GNOME keyboard shortcuts, reproduced on every run so a fresh install
# matches your existing setup. Each entry maps a key binding to a command.
# The screenshot entries call helper scripts the gnome role installs to
# ~/.local/bin (they capture to the Wayland clipboard via wl-copy). Leave the
# list empty to skip custom shortcuts entirely.
gnome_custom_keybindings:
  - name: "1Password Quick Access"
    binding: "<Shift><Control>space"
    command: "/usr/bin/1password --quick-access"
  - name: "Open File Manager"
    binding: "<Super>e"
    command: "nautilus --new-window"
  - name: "Area Screenshot (to clipboard)"
    binding: "<Shift><Alt>4"
    command: "/home/{{ local_user }}/.local/bin/area-screenshot-clip"
  - name: "Fullscreen Screenshot (to clipboard)"
    binding: "<Shift><Alt>3"
    command: "/home/{{ local_user }}/.local/bin/fullscreen-screenshot-clip"

# python3
ansible_python_interpreter: /usr/bin/python3

# Target version (used for pinning images / docs)
fedora_version: 43
rocky_version: 9

# Header stamped into rendered config files via `{{ ansible_managed }}`.
# Replaces the deprecated DEFAULT_MANAGED_STR setting in ansible.cfg.
ansible_managed: "Ansible managed — do not edit by hand"
